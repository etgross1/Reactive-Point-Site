<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactive Point Engineering — Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161c;
    --blue:#1b3fd6;
    --orange:#f2921d;
    --paper:#ffffff;
    --wash:#eef1fb;
    --rule:#dfe3ee;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--paper);
    color:var(--ink);
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'IBM Plex Sans', sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  /* faint angle mark, echoing the logo's phase-angle motif, anchored in the corner */
  .corner-mark{
    position:fixed;
    bottom:0;
    left:0;
    width:min(46vw,520px);
    height:auto;
    opacity:0.5;
    pointer-events:none;
  }

  main{
    width:100%;
    max-width:640px;
    padding:8vh 32px 6vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:1;
  }

  .logo{
    width:min(58vw,240px);
    height:auto;
    margin-bottom:clamp(28px,6vh,52px);
  }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:500;
    font-size:clamp(2.4rem,6vw,3.6rem);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 14px;
    color:var(--ink);
  }

  p.sub{
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:400;
    font-size:clamp(1.05rem,2.4vw,1.2rem);
    color:#4b4f5c;
    margin:0 0 clamp(40px,7vh,64px);
    max-width:34ch;
  }

  /* AC waveform divider — the one deliberate motion on the page */
  .wave-wrap{
    width:min(100%,420px);
    height:56px;
    margin-bottom:clamp(36px,6vh,56px);
  }

  .wave-wrap svg{
    width:200%;
    height:100%;
    animation:drift 7s linear infinite;
  }

  @keyframes drift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  footer{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.85rem;
    color:#8a8f9c;
    letter-spacing:0.01em;
  }

  footer a{
    color:#5a5eb0;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color 0.15s ease;
  }

  footer a:hover{
    border-color:#5a5eb0;
  }

  @media (prefers-reduced-motion: reduce){
    .wave-wrap svg{ animation:none; }
  }

  @media (max-width:420px){
    main{ padding:9vh 22px 6vh; }
  }
</style>
</head>
